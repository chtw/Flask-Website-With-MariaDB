
{% extends "Layout.html" %}
{% block title %}Edit Project{% endblock %}

{% block content %}

<div class="edit-project-card">

    <h1>Edit Project</h1>

    <form action="{{ url_for('edit', id=project['id']) }}" method="POST" enctype="multipart/form-data">
          
        <label for="title">Project Title</label>
        <input type="text" id="title" name="title" value="{{ project['title'] }}" required>
               
        <label for="description">Description</label>
        <textarea id="description" name="description" required>{{ project['description'] }}</textarea>
                 
                
        <label>Current Image</label>
        
        <div class="image-card">
             <img src="{{ url_for('image', id=project['id']) }}" class="current-image"  alt="{{ project['title'] }}">
        </div>
       
             
        <label for="image">Change Image</label>
        <input type="file" id="image" name="image" accept="image/*">

        <button type="submit">Save Changes</button>

    </form>

</div>

{% endblock %}
